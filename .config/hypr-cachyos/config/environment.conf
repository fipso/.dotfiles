# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Enviroment Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

envd = HYPRCURSOR_SIZE,24
envd = XCURSOR_SIZE,24
envd = QT_CURSOR_SIZE,24
# Cursor theme name — needed for Chrome to show the pointer (hand) cursor on
# links. Installed via home.pointerCursor in nix/nixos/home.nix.
envd = HYPRCURSOR_THEME,Bibata-Modern-Classic
envd = XCURSOR_THEME,Bibata-Modern-Classic
# NOTE: still deliberately no *global* GDK_SCALE. It is a single number, but
# this machine runs three monitors at three different scales (eDP-1 2.0,
# HDMI-A-1 1.6, DP-3 1.0) and XWayland exposes one X screen to every client, so
# there is no value that is right everywhere. GDK_SCALE=2 was correct on the
# laptop panel and 2x / 1.25x too large on the externals -- that is what made
# Spotify and Orca Slicer look zoomed. Scale is set per app instead, on the
# XWayland clients that need it (see orca-slicer in nix/nixos/home.nix).
envd = QT_SCALE_FACTOR,1

xwayland {
  # Now true, so Hyprland stops rendering XWayland clients at logical size and
  # upscaling them -- that upscale is what made Orca Slicer's text blurry on
  # the 1.6x and 2.0x monitors. The earlier "zoomed" result came from setting
  # GDK_SCALE=2 while this was false: the app doubled its UI and Hyprland then
  # scaled it again. With this true, an app carries its own scale exactly once.
  #
  # Trade-off: XWayland clients WITHOUT their own GDK_SCALE now render 1:1, so
  # they look small on eDP-1 (2.0) and HDMI-A-1 (1.6); on DP-3 (1.0) nothing
  # changes. Spotify normally lives on DP-3 so it is unaffected, but if an
  # XWayland app looks too small on a scaled monitor, wrap it the way
  # orca-slicer is wrapped rather than reverting this.
  force_zero_scaling = true
}

plugin {
  hyprsplit {
      num_workspaces = 6
    }
}
